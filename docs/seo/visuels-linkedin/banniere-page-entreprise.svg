<svg width="1128" height="191" viewBox="0 0 1128 191" xmlns="http://www.w3.org/2000/svg">
  <title>Claude Agency — bannière page entreprise LinkedIn</title>

  <!-- fond crème -->
  <rect x="0" y="0" width="1128" height="191" fill="#FBF7F1"/>

  <!-- bandeau terracotta plein (gauche) -->
  <rect x="0" y="0" width="360" height="191" fill="#CC785C"/>

  <!-- wordmark sur le bandeau terracotta : une seule ligne, casée en haut du bandeau
       pour rester visible malgré le logo de page (cercle) que LinkedIn superpose
       en bas à gauche de la couverture -->
  <text x="180" y="60" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="32" letter-spacing="2" fill="#FBF7F1">CLAUDE AGENCY</text>

  <!-- tagline sur fond crème -->
  <text x="404" y="86" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="30" fill="#2B2724">L'IA au service des organismes de formation</text>
  <text x="404" y="126" font-family="Arial, Helvetica, sans-serif" font-weight="400"
        font-size="26" fill="#2B2724">Moins d'administratif, plus de pédagogie.</text>
</svg>
